name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }} --workspace
      - if: runner.os != 'Windows'
        run: |
          target/${{ matrix.target }}/release/hsin --version
          target/${{ matrix.target }}/release/hsind --version
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/hsin.exe" --version
          & "target/${{ matrix.target }}/release/hsind.exe" --version
      - if: matrix.archive == 'tar'
        run: sh scripts/package.sh ${{ matrix.target }}
      - if: matrix.archive == 'zip'
        shell: pwsh
        run: ./scripts/package.ps1 -Target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: hsin-${{ matrix.target }}
          path: dist/*
