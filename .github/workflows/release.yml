name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, created from the dispatched commit when absent (for example v0.1.0). Must match the workspace version."
        required: true
      prerelease:
        description: "Mark the release as a pre-release. GitHub excludes pre-releases from /releases/latest, which the documented download URLs rely on."
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag names the version being shipped
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "${{ inputs.tag }}" != "v$version" ]; then
            echo "::error::tag ${{ inputs.tag }} does not match workspace version $version"
            exit 1
          fi

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} --workspace
      - if: runner.os != 'Windows'
        run: |
          target/${{ matrix.target }}/release/hsin --version
          target/${{ matrix.target }}/release/hsind --version
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/hsin.exe" --version
          & "target/${{ matrix.target }}/release/hsind.exe" --version
      - if: matrix.archive == 'tar'
        run: sh scripts/package.sh ${{ matrix.target }}
      - if: matrix.archive == 'zip'
        shell: pwsh
        run: ./scripts/package.ps1 -Target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: hsin-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect checksums
        run: |
          cd artifacts
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm -f *.sha256
          ls -l
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          flags=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            flags="$flags --prerelease"
          fi
          if [ "${{ inputs.draft }}" = "true" ]; then
            flags="$flags --draft"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "$TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              $flags
          fi
