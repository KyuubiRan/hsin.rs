[workspace]
resolver = "2"
members = [
    "crates/hsin-core",
    "crates/hsin-ipc",
    "crates/hsind",
    "crates/hsin",
]

[workspace.package]
version = "0.2.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/KyuubiRan/hsin.rs"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
